[project]
name = "git"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "onefivesevenceo", email = "onefivesevenceo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.1",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
git = "git:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
